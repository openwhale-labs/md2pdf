<style>
@page { size: A4; margin: 0; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body {
  font-family: "PingFang SC", -apple-system, "Helvetica Neue", sans-serif;
  font-size: 10.8pt; line-height: 1.58; color: #1b1b1b; margin: 0;
  text-align: justify;
}
p { margin: 0 0 .65em; }
h1,h2,h3,h4 { font-weight: 600; line-height: 1.3; margin: 1.15em 0 .45em; }
h1 { font-size: 1.8em; } h2 { font-size: 1.32em; } h3 { font-size: 1.1em; }
