[project]
name = "md2pdf-cjk"
version = "0.1.0"
description = "Markdown to a well-typeset PDF, with CJK text as a first-class citizen. pandoc + Typst, plus a macOS CoreText engine for the system PingFang font."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "OpenWhale Labs" }]
keywords = ["markdown", "pdf", "typst", "pandoc", "cjk", "chinese"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/openwhale-labs/md2pdf"
Issues = "https://github.com/openwhale-labs/md2pdf/issues"

[project.scripts]
md2pdf = "md2pdf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/md2pdf"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
